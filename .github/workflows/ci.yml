name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    name: "build + test (core, api, cli, mcp-server, web) · e2e (web)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @agenid/core test
      - run: pnpm --filter @agenid/api test
      - run: pnpm --filter @agenid/mcp-server test
      - run: pnpm --filter @agenid/cli test
      - run: pnpm --filter @agenid/web test
      - run: pnpm --filter @agenid/web e2e
